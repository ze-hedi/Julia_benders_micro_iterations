name : CI 

on : 
    push : 
        branches : [main] 
    
jobs:
  build:
    runs-on: ubuntu-latest  # no container: here

    steps:
      - uses: actions/checkout@v4  # runs on ubuntu, no glibc issue

      - name: Compile inside CentOS 7
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            centos:7 bash -c "
              yum install -y curl tar gzip &&
              curl -fsSL https://install.julialang.org | sh -s -- --yes &&
              export PATH=$HOME/.juliaup/bin:$PATH &&
              julia --project=. -e 'using Pkg; Pkg.instantiate()' &&
              julia --project=. compile.jl
            "

      - uses: actions/upload-artifact@v4
        with:
          name: compiled-lib
          path: lib/*.so