name: CI Ubuntu

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libopenmpi-dev \
            libboost-mpi-dev \
            libboost-serialization-dev \
            libeigen3-dev \
            nlohmann-json3-dev

      - name: Configure
        run: cmake -B build/ubuntu -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build/ubuntu

      - name: Run tests
        run: ctest --test-dir build/ubuntu --output-on-failure

      - name: Package artifact
        run: tar -czf cpp_plugin-ubuntu.tar.gz -C build/ubuntu/cpp_plugin/ cpp_plugin.so

      - name: Upload library
        uses: actions/upload-artifact@v4
        with:
          name: cpp_plugin-ubuntu
          path: cpp_plugin-ubuntu.tar.gz
